name: mnemosyne
version: 3.15.2
description: "Native local memory for Hermes — SQLite with vector search, FTS5 hybrid ranking, episodic consolidation, temporal triples, and bidirectional sync with optional client-side encryption. Zero cloud. Zero latency."
author: Abdias J
provides_tools:
  - mnemosyne_remember
  - mnemosyne_recall
  - mnemosyne_stats
  - mnemosyne_triple_add
  - mnemosyne_triple_query
  - mnemosyne_sleep
  - mnemosyne_scratchpad_write
  - mnemosyne_scratchpad_read
  - mnemosyne_scratchpad_clear
  - mnemosyne_invalidate
  - mnemosyne_export
  - mnemosyne_import
  - mnemosyne_update
  - mnemosyne_forget
  - mnemosyne_diagnose
  - mnemosyne_graph_query
  - mnemosyne_graph_link
  - mnemosyne_sync_push
  - mnemosyne_sync_pull
  - mnemosyne_sync_status
  - mnemosyne_batch
  - mnemosyne_get
  - mnemosyne_validate
  - mnemosyne_remember_canonical
  - mnemosyne_recall_canonical
  - mnemosyne_forget_canonical
  - mnemosyne_persona_promote
  - mnemosyne_persona_demote
  - mnemosyne_persona_list
  - mnemosyne_persona_reinforce
  - mnemosyne_triple_end
  - mnemosyne_shared_remember
  - mnemosyne_shared_recall
  - mnemosyne_shared_forget
  - mnemosyne_shared_stats
provides_hooks:
  - pre_llm_call
  - on_session_start
  - post_tool_call
dependencies: []
