# Hermes catalog wrapper. Not a buildable distribution: the package that
# ships on PyPI is integrations/hermes (mnemosyne-hermes). Hermes reads
# [project].dependencies from this file and installs them into its venv.
[project]
name = "mnemosyne-plugin"
version = "0.7.4"
description = "Mnemosyne memory provider for Hermes Agent, catalog wrapper"
requires-python = ">=3.11"
dependencies = [
    "mnemosyne-hermes==0.7.4",
    "mnemosyne-memory[embeddings]==4.0.0b4",
]

# Exempt only reviewed exact pins; transitive releases keep Hermes' quarantine.
[tool.uv.exclude-newer-package]
mnemosyne-hermes = false
mnemosyne-memory = false
